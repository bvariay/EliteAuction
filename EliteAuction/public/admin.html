<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة | مزاد النخبة</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .stat-card.green { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .stat-card.orange { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .stat-card.blue { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .stat-number { font-size: 2.5rem; font-weight: bold; }
        .stat-label { font-size: 0.9rem; opacity: 0.9; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="fas fa-gavel"></i> مزاد النخبة
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">الرئيسية</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/admin.html">لوحة الإدارة</a></li>
                    <li class="nav-item"><a class="nav-link" href="/add-auction.html">إضافة مزاد</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <h3><i class="fas fa-cog"></i> لوحة الإدارة</h3>
        
        <!-- الإحصائيات -->
        <div class="row mt-4" id="stats">
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-number" id="total-auctions">0</div>
                    <div class="stat-label">إجمالي المزادات</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card green">
                    <div class="stat-number" id="total-users">0</div>
                    <div class="stat-label">إجمالي المستخدمين</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card orange">
                    <div class="stat-number" id="total-bids">0</div>
                    <div class="stat-label">إجمالي المزايدات</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card blue">
                    <div class="stat-number" id="active-auctions">0</div>
                    <div class="stat-label">مزادات نشطة</div>
                </div>
            </div>
        </div>

        <!-- تبويبات -->
        <ul class="nav nav-tabs mt-4" id="adminTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="auctions-tab" data-bs-toggle="tab" data-bs-target="#auctions" type="button">
                    <i class="fas fa-list"></i> المزادات
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="users-tab" data-bs-toggle="tab" data-bs-target="#users" type="button">
                    <i class="fas fa-users"></i> المستخدمين
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="bids-tab" data-bs-toggle="tab" data-bs-target="#bids" type="button">
                    <i class="fas fa-gavel"></i> المزايدات
                </button>
            </li>
        </ul>

        <div class="tab-content mt-3" id="adminTabsContent">
            <!-- المزادات -->
            <div class="tab-pane fade show active" id="auctions" role="tabpanel">
                <div class="card">
                    <div class="card-body" id="admin-auctions">
                        <div class="text-center py-3">
                            <div class="spinner-border text-primary"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- المستخدمين -->
            <div class="tab-pane fade" id="users" role="tabpanel">
                <div class="card">
                    <div class="card-body" id="admin-users">
                        <div class="text-center py-3">
                            <div class="spinner-border text-primary"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- المزايدات -->
            <div class="tab-pane fade" id="bids" role="tabpanel">
                <div class="card">
                    <div class="card-body" id="admin-bids">
                        <div class="text-center py-3">
                            <div class="spinner-border text-primary"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <a href="/" class="btn btn-secondary">← العودة للرئيسية</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = 'http://127.0.0.1:3000/api';

        // تحميل الإحصائيات
        async function loadStats() {
            try {
                const [auctionsRes, usersRes, bidsRes] = await Promise.all([
                    fetch(`${API_BASE}/auctions`),
                    fetch(`${API_BASE}/users`),
                    fetch(`${API_BASE}/bids`)
                ]);

                const auctions = await auctionsRes.json();
                const users = await usersRes.json();
                const bids = await bidsRes.json();

                document.getElementById('total-auctions').textContent = auctions.data?.length || 0;
                document.getElementById('total-users').textContent = users.data?.length || 0;
                document.getElementById('total-bids').textContent = bids.data?.length || 0;
                
                const active = auctions.data?.filter(a => a.current_price > 0) || [];
                document.getElementById('active-auctions').textContent = active.length;
            } catch (error) {
                console.error('❌ خطأ في تحميل الإحصائيات:', error);
            }
        }

        // تحميل المزادات
        async function loadAuctions() {
            try {
                const response = await fetch(`${API_BASE}/auctions`);
                const data = await response.json();
                const container = document.getElementById('admin-auctions');
                
                if (data.success && data.data.length > 0) {
                    container.innerHTML = `
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>الصورة</th>
                                        <th>العنوان</th>
                                        <th>التصنيف</th>
                                        <th>السعر</th>
                                        <th>السعر الحالي</th>
                                        <th>الإجراءات</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${data.data.map(a => `
                                        <tr>
                                            <td>${a.id}</td>
                                            <td>
                                                <img src="${a.image || 'https://via.placeholder.com/50'}" 
                                                     style="width:50px;height:50px;object-fit:cover;border-radius:8px;">
                                            </td>
                                            <td>${a.title}</td>
                                            <td><span class="badge bg-primary">${a.category}</span></td>
                                            <td>$${a.price}</td>
                                            <td>$${a.current_price}</td>
                                            <td>
                                                <button class="btn btn-sm btn-danger" onclick="deleteAuction(${a.id})">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                } else {
                    container.innerHTML = `<div class="alert alert-info">لا توجد مزادات</div>`;
                }
            } catch (error) {
                document.getElementById('admin-auctions').innerHTML = `
                    <div class="alert alert-danger">خطأ في الاتصال بالخادم</div>
                `;
            }
        }

        // تحميل المستخدمين
        async function loadUsers() {
            try {
                const response = await fetch(`${API_BASE}/users`);
                const data = await response.json();
                const container = document.getElementById('admin-users');
                
                if (data.success && data.data.length > 0) {
                    container.innerHTML = `
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>اسم المستخدم</th>
                                        <th>البريد</th>
                                        <th>الدور</th>
                                        <th>تاريخ التسجيل</th>
                                        <th>الإجراءات</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${data.data.map(u => `
                                        <tr>
                                            <td>${u.id}</td>
                                            <td>${u.username}</td>
                                            <td>${u.email}</td>
                                            <td><span class="badge ${u.role === 'admin' ? 'bg-danger' : 'bg-secondary'}">${u.role}</span></td>
                                            <td>${new Date(u.created_at).toLocaleDateString('ar')}</td>
                                            <td>
                                                <button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id})">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                } else {
                    container.innerHTML = `<div class="alert alert-info">لا يوجد مستخدمين</div>`;
                }
            } catch (error) {
                document.getElementById('admin-users').innerHTML = `
                    <div class="alert alert-danger">خطأ في الاتصال بالخادم</div>
                `;
            }
        }

        // تحميل المزايدات
        async function loadBids() {
            try {
                const response = await fetch(`${API_BASE}/bids`);
                const data = await response.json();
                const container = document.getElementById('admin-bids');
                
                if (data.success && data.data.length > 0) {
                    container.innerHTML = `
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>المزاد</th>
                                        <th>المستخدم</th>
                                        <th>المبلغ</th>
                                        <th>التاريخ</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${data.data.map(b => `
                                        <tr>
                                            <td>${b.id}</td>
                                            <td>${b.auction_title || `مزاد #${b.auction_id}`}</td>
                                            <td>${b.username || `مستخدم #${b.user_id}`}</td>
                                            <td><span class="badge bg-success">$${b.amount}</span></td>
                                            <td>${new Date(b.created_at).toLocaleString('ar')}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                } else {
                    container.innerHTML = `<div class="alert alert-info">لا توجد مزايدات</div>`;
                }
            } catch (error) {
                document.getElementById('admin-bids').innerHTML = `
                    <div class="alert alert-danger">خطأ في الاتصال بالخادم</div>
                `;
            }
        }

        // حذف مزاد
        async function deleteAuction(id) {
            if (confirm('هل أنت متأكد من حذف هذا المزاد؟')) {
                try {
                    const response = await fetch(`${API_BASE}/auctions/${id}`, {
                        method: 'DELETE'
                    });
                    const data = await response.json();
                    if (data.success) {
                        alert('✅ تم حذف المزاد');
                        loadAuctions();
                        loadStats();
                    } else {
                        alert('❌ ' + data.message);
                    }
                } catch (error) {
                    alert('❌ خطأ في الاتصال بالخادم');
                }
            }
        }

        // حذف مستخدم
        async function deleteUser(id) {
            if (confirm('هل أنت متأكد من حذف هذا المستخدم؟')) {
                try {
                    const response = await fetch(`${API_BASE}/users/${id}`, {
                        method: 'DELETE'
                    });
                    const data = await response.json();
                    if (data.success) {
                        alert('✅ تم حذف المستخدم');
                        loadUsers();
                        loadStats();
                    } else {
                        alert('❌ ' + data.message);
                    }
                } catch (error) {
                    alert('❌ خطأ في الاتصال بالخادم');
                }
            }
        }

        // تحميل كل شيء عند بدء الصفحة
        document.addEventListener('DOMContentLoaded', function() {
            loadStats();
            loadAuctions();
            loadUsers();
            loadBids();
        });
    </script>
</body>
</html>
