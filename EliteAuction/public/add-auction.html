<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة مزاد | مزاد النخبة</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="fas fa-gavel"></i> مزاد النخبة
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">الرئيسية</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/add-auction.html">إضافة مزاد</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0"><i class="fas fa-plus-circle"></i> إضافة مزاد جديد</h4>
                    </div>
                    <div class="card-body">
                        <form id="add-auction-form">
                            <div class="mb-3">
                                <label class="form-label">عنوان المزاد *</label>
                                <input type="text" id="title" class="form-control" placeholder="مثال: سيارة مرسيدس 2023" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">الوصف</label>
                                <textarea id="description" class="form-control" rows="3" placeholder="وصف المزاد"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">التصنيف</label>
                                <select id="category" class="form-select">
                                    <option value="سيارات">سيارات</option>
                                    <option value="عقارات">عقارات</option>
                                    <option value="مقتنيات">مقتنيات</option>
                                    <option value="إلكترونيات">إلكترونيات</option>
                                    <option value="أخرى">أخرى</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">السعر *</label>
                                <input type="number" id="price" class="form-control" placeholder="مثال: 50000" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">العملة</label>
                                <select id="currency" class="form-select">
                                    <option value="$">دولار ($)</option>
                                    <option value="€">يورو (€)</option>
                                    <option value="£">جنيه (£)</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-save"></i> إضافة المزاد
                            </button>
                        </form>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <a href="/" class="text-decoration-none">← العودة للرئيسية</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
