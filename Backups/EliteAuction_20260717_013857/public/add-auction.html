<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إضافة مزاد</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header class="header">

<div class="logo">
🔨 مزاد النخبة
</div>

</header>



<section class="categories">


<h2>
إضافة مزاد جديد
</h2>


<div class="auction-card">


<input id="title" placeholder="اسم المزاد">


<br><br>


<textarea id="description" placeholder="وصف المزاد"></textarea>


<br><br>


<input id="category" placeholder="التصنيف">


<br><br>


<input 
id="price" 
type="number" 
placeholder="السعر الابتدائي">


<select id="currency">

<option value="$">دولار $</option>

<option value="ر.س">ريال سعودي</option>

<option value="ر.ي">ريال يمني</option>

</select>


<br><br>


<input 
id="image" 
type="file"
accept="image/*">


<br><br>


<button onclick="addAuction()">

نشر المزاد

</button>


</div>


</section>



<script>


async function addAuction(){


const formData = new FormData();


formData.append(
"title",
document.getElementById("title").value
);


formData.append(
"description",
document.getElementById("description").value
);


formData.append(
"category",
document.getElementById("category").value
);


formData.append(
"price",
document.getElementById("price").value
);


formData.append(
"currency",
document.getElementById("currency").value
);



const image =
document.getElementById("image").files[0];


if(image){

formData.append(
"image",
image
);

}



const response = await fetch(
"/api/auctions",
{
method:"POST",
body:formData
}
);



if(response.ok){

alert("تم إضافة المزاد بنجاح");

window.location.href="/";

}

else{

alert("حدث خطأ");

}


}


</script>


</body>

</html>
