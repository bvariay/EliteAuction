<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معارض السيارات | مزاد النخبة</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .showroom-card {
            background: linear-gradient(135deg, rgba(22,33,62,0.95), rgba(26,26,46,0.95));
            border: 1px solid rgba(108,60,225,0.2);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s ease;
            cursor: pointer;
            height: 100%;
        }
        .showroom-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 60px rgba(108,60,225,0.3);
            border-color: var(--secondary);
        }
        .showroom-card .card-img-top {
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
        }
        .showroom-card .rating {
            color: var(--gold);
        }
        .showroom-card .showroom-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
        }
        .showroom-card .showroom-address {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .showroom-card .car-count {
            background: rgba(0,212,255,0.1);
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.8rem;
            color: var(--secondary);
        }
        .showroom-detail {
            background: rgba(22,33,62,0.95);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(108,60,225,0.2);
        }
        .car-item {
            background: rgba(26,26,46,0.8);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(108,60,225,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .car-item:hover {
            border-color: var(--secondary);
            transform: translateX(-5px);
        }
        .car-item .car-title {
            font-weight: 700;
            color: white;
        }
        .car-item .car-detail {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .car-item .car-price {
            color: var(--secondary);
            font-weight: 700;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="fas fa-gavel"></i> مزاد النخبة
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">الرئيسية</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/showrooms.html">معارض السيارات</a></li>
                    <li class="nav-item"><a class="nav-link" href="/add-auction.html">إضافة مزاد</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin.html">لوحة الإدارة</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div id="showrooms-container">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">جاري التحميل...</span>
                </div>
                <p class="mt-2 text-light">جاري تحميل المعارض...</p>
            </div>
        </div>
    </div>

    <!-- Modal تفاصيل المعرض -->
    <div class="modal fade" id="showroomModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content" style="background: #1a1a2e; color: white; border: 1px solid rgba(108,60,225,0.3);">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="showroomModalTitle">المعرض</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="showroomModalBody">
                    <div class="text-center py-3">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">جاري التحميل...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal تفاصيل السيارة -->
    <div class="modal fade" id="carModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content" style="background: #1a1a2e; color: white; border: 1px solid rgba(108,60,225,0.3);">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="carModalTitle">تفاصيل السيارة</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="carModalBody">
                    <div class="text-center py-3">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">جاري التحميل...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = 'http://127.0.0.1:3000/api';

        // تحميل المعارض
        async function loadShowrooms() {
            try {
                const response = await fetch(`${API_BASE}/showrooms`);
                const data = await response.json();
                const container = document.getElementById('showrooms-container');
                
                if (data.success && data.data.length > 0) {
                    container.innerHTML = `
                        <h3 class="mb-4 text-light"><i class="fas fa-warehouse"></i> معارض السيارات</h3>
                        <div class="row">
                            ${data.data.map(s => `
                                <div class="col-md-4 col-lg-3 mb-4">
                                    <div class="showroom-card card" onclick="loadShowroomDetail(${s.id})">
                                        <div class="card-img-top d-flex align-items-center justify-content-center" style="height:150px;">
                                            <i class="fas fa-car" style="font-size:4rem;color:white;opacity:0.5;"></i>
                                        </div>
                                        <div class="card-body">
                                            <div class="showroom-name">${s.name}</div>
                                            <div class="showroom-address"><i class="fas fa-map-marker-alt"></i> ${s.address || 'لا يوجد عنوان'}</div>
                                            <div class="d-flex justify-content-between align-items-center mt-2">
                                                <span class="rating"><i class="fas fa-star"></i> ${s.rating || 0}</span>
                                                <span class="car-count"><i class="fas fa-car"></i> ${s.car_count || 0}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="alert alert-info text-center">
                            <h5>📭 لا توجد معارض حالياً</h5>
                            <p class="mb-0">سيتم إضافة المعارض قريباً</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('خطأ:', error);
                document.getElementById('showrooms-container').innerHTML = `
                    <div class="alert alert-danger">خطأ في الاتصال بالخادم</div>
                `;
            }
        }

        // تحميل تفاصيل المعرض
        async function loadShowroomDetail(showroomId) {
            try {
                const response = await fetch(`${API_BASE}/showrooms/${showroomId}`);
                const data = await response.json();
                
                if (data.success) {
                    const { showroom, cars } = data.data;
                    const modalBody = document.getElementById('showroomModalBody');
                    document.getElementById('showroomModalTitle').textContent = showroom.name;
                    
                    modalBody.innerHTML = `
                        <div class="showroom-detail">
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="text-center">
                                        <div style="background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:50%;width:120px;height:120px;margin:0 auto;display:flex;align-items:center;justify-content:center;">
                                            <i class="fas fa-warehouse" style="font-size:3rem;color:white;"></i>
                                        </div>
                                        <h4 class="mt-3">${showroom.name}</h4>
                                        <p class="text-muted">${showroom.address || 'لا يوجد عنوان'}</p>
                                        <div class="rating"><i class="fas fa-star text-warning"></i> ${showroom.rating || 0}</div>
                                        <p><i class="fas fa-phone"></i> ${showroom.phone || 'لا يوجد رقم'}</p>
                                        <p><i class="fas fa-envelope"></i> ${showroom.email || 'لا يوجد بريد'}</p>
                                    </div>
                                </div>
                                <div class="col-md-8">
                                    <h5><i class="fas fa-car"></i> السيارات المتوفرة (${cars.length})</h5>
                                    ${cars.length > 0 ? cars.map(car => `
                                        <div class="car-item" onclick="loadCarDetail(${showroom.id}, ${car.id})">
                                            <div class="row align-items-center">
                                                <div class="col-8">
                                                    <div class="car-title">${car.title}</div>
                                                    <div class="car-detail">${car.brand} ${car.model || ''} - ${car.year || ''}</div>
                                                    <div class="car-detail"><i class="fas fa-tachometer-alt"></i> ${car.mileage || 0} كم</div>
                                                </div>
                                                <div class="col-4 text-end">
                                                    <div class="car-price">${car.currency || '$'} ${car.price.toLocaleString()}</div>
                                                    <span class="badge bg-primary">${car.fuel_type || ''}</span>
                                                </div>
                                            </div>
                                        </div>
                                    `).join('') : `
                                        <div class="text-center py-3 text-muted">لا توجد سيارات في هذا المعرض</div>
                                    `}
                                </div>
                            </div>
                        </div>
                    `;
                    
                    new bootstrap.Modal(document.getElementById('showroomModal')).show();
                }
            } catch (error) {
                console.error('خطأ:', error);
                document.getElementById('showroomModalBody').innerHTML = `
                    <div class="alert alert-danger">خطأ في تحميل تفاصيل المعرض</div>
                `;
            }
        }

        // تحميل تفاصيل السيارة
        async function loadCarDetail(showroomId, carId) {
            try {
                const response = await fetch(`${API_BASE}/showrooms/${showroomId}/car/${carId}`);
                const data = await response.json();
                
                if (data.success) {
                    const car = data.data;
                    document.getElementById('carModalTitle').textContent = car.title;
                    document.getElementById('carModalBody').innerHTML = `
                        <div class="row">
                            <div class="col-md-6">
                                <div style="background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:20px;height:300px;display:flex;align-items:center;justify-content:center;">
                                    <i class="fas fa-car" style="font-size:8rem;color:white;opacity:0.3;"></i>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <h3>${car.title}</h3>
                                <p class="text-muted">${car.description || 'لا يوجد وصف'}</p>
                                <div class="row mt-3">
                                    <div class="col-6"><strong>الماركة:</strong> ${car.brand}</div>
                                    <div class="col-6"><strong>الموديل:</strong> ${car.model || '-'}</div>
                                    <div class="col-6"><strong>السنة:</strong> ${car.year || '-'}</div>
                                    <div class="col-6"><strong>نوع الوقود:</strong> ${car.fuel_type || '-'}</div>
                                    <div class="col-6"><strong>ناقل الحركة:</strong> ${car.transmission || '-'}</div>
                                    <div class="col-6"><strong>اللون:</strong> ${car.color || '-'}</div>
                                    <div class="col-6"><strong>عدد الكيلومترات:</strong> ${car.mileage || 0} كم</div>
                                </div>
                                <div class="mt-4">
                                    <h4 class="text-success">${car.currency || '$'} ${car.price.toLocaleString()}</h4>
                                    <p class="text-muted small">المعرض: ${car.showroom_name}</p>
                                    <p class="text-muted small">${car.showroom_address}</p>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    new bootstrap.Modal(document.getElementById('carModal')).show();
                }
            } catch (error) {
                console.error('خطأ:', error);
                document.getElementById('carModalBody').innerHTML = `
                    <div class="alert alert-danger">خطأ في تحميل تفاصيل السيارة</div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', loadShowrooms);
    </script>
</body>
</html>
